<!DOCTYPE html>
<!-- SOURCE OF TRUTH: <repo>/webpages/plot.html -- the copy beside the `ss` binary is written by
     ss's POST_BUILD step and is overwritten on every build. -->
<!-- created by Weinan Lin -->
<html lang="en">
<meta name="viewport" user-scalable="no"
  content="width=device-width,minimum-scale=0.75,maximum-scale=0.75,initial-scale=0.75" />

<head>
  <!-- Google tag (gtag.js) -->
  <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKTQQPYBTB"></script>
  <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-QKTQQPYBTB');
  </script> -->

  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css"
    integrity="sha384-Xi8rHCmBmhbuyyhbI88391ZKP2dmfnOl4rT9ZfRI7mLTdk1wblIUnrIq35nqwEvC" crossorigin="anonymous">
  <!-- The loading of KaTeX is deferred to speed up page rendering -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"
    integrity="sha384-X/XCfMm41VSsqRNQgDerQczD69XqmjOOOwYQvr/uuC+j4OPoNhVgjdGFwhvN02Ja"
    crossorigin="anonymous"></script>
  <title id="title">AdamsSS</title>
  <link rel="stylesheet" href="plot_assets/main.css">
</head>

<body onload="init()">
  <svg id="svg_ss">
    <g id="g_svg">
      <g id="g_plot">
        <rect id="rect_selected" x="-1000" y="-1000" width="1" height="1" fill="red" opacity="0.1" />
        <rect id="rect_separator" x="-1000" y="-0.5" width="1" height="300" fill="pink" opacity="0.2" data-x="14" data-y="4" />
        <rect id="rect_second_ss" x="-1000" y="-0.5" width="300" height="300" fill="yellow" opacity="0.1" data-x="14" data-y="4" />

        <g id="g_grid" stroke-width="0.009" stroke="grey"></g>

        <g id="g_strtlines" fill="transparent"></g>
        <g id="g_strtlines_maroon" stroke="maroon" fill="transparent"></g>
        <g id="g_strtlines_purple" stroke="purple" fill="transparent"></g>
        <g id="g_strtlines_darkslategray" stroke="darkslategray" fill="transparent"></g>
        <g id="g_strtlines_black" stroke="black" fill="transparent"></g>
        <!-- Hidden extensions (extensions.js): dashed, drawn only on the E_infinity page. No class
             "p", so updateVisibility leaves them to extensions.js. -->
        <g id="g_extlines" fill="transparent" style="display:none"></g>

        <g id="g_difflines" fill="transparent"></g>
        <g id="g_difflines_orange" stroke="orange" fill="transparent"></g>
        <g id="g_difflines_blue" stroke="blue" fill="transparent"></g>
        <g id="g_difflines_green" stroke="green" fill="transparent"></g>
        <g id="g_difflines_red" stroke="red" fill="transparent"></g>
        <g id="g_difflines_deepskyblue" stroke="DeepSkyBlue" fill="transparent"></g>
        <g id="g_difflines_black" stroke="black" fill="transparent"></g>
        <g id="g_difflines_purple" stroke="#a855f7" fill="transparent"></g>
        <g id="g_difflines_teal" stroke="#008080" fill="transparent"></g>
        <g id="g_difflines_pink" stroke="#FF69B4" fill="transparent"></g>
        <g id="g_difflines_steele" stroke="#B0C4DE" fill="transparent"></g>
          <!-- <circle data-i="168" class="p b cw" cx="30" cy="10" r="0.07999999821186066"> </circle> -->

        <!-- Invisible, fat copies of the differential lines: a drawn line is a fraction of a unit
             wide and practically unclickable, so these carry the pointer target for "show me the
             proof of this differential". Deliberately placed before the bullet groups below, so
             clicking a class still selects the class. -->
        <!-- visibleStroke, not stroke: a hit line hidden by the page filter (visibility: hidden) must not catch clicks -->
        <g id="g_diffhits" stroke="transparent" fill="none" pointer-events="visibleStroke"></g>

        <!-- Curves s = f(n) from the Graph panel (graph.js). No class "p": updateVisibility hides
             every ".p" it does not know. Below the bullets, so classes stay clickable. -->
        <g id="g_graphs" fill="none" pointer-events="none"></g>

        <g id="g_prod" fill="green"></g>
        <g id="g_map" fill="Fuchsia"></g>
        <!-- The Products panel's rings around the bullets a result refers to (products.js). No
             class "p": updateVisibility hides every ".p" it does not know. -->
        <g id="g_products_hl" fill="none"></g>
        <!-- Shift-click highlights (main.js, toggleHighlight). Not ".p" either, and never a click
             target, so a second shift-click reaches the object underneath. -->
        <g id="g_highlights" fill="none" stroke="#ffe600" pointer-events="none"></g>
        <!-- Towers of a multiplier through chosen classes (main.js, TOWERS). Lines carry class "p tl",
             so updateVisibility shows them by page like structure lines. -->
        <g id="g_towers" fill="none" pointer-events="none"></g>
        <!-- A ring around the selected class: the red dot alone is hard to find, worst in dark mode. -->
        <circle id="circle_selected" cx="-1000" cy="-1000" r="0" fill="none" pointer-events="none"></circle>
        <circle id="circle_mouseon" cx="-1000" cy="-1000" r="0" fill="grey"></circle>
        <g id="g_bullets_black" fill="black"></g>
        <g id="g_bullets_blue" fill="blue"></g>
        <g id="g_bullets_grey" fill="grey"></g>
        <g id="g_labels" text-anchor="end" style="
                -moz-user-select: none;
                -webkit-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -o-user-select: none;
              " unselectable="on" onselectstart="return false;" onmousedown="return false;" transform="scale(1,-1)">
        </g>
        
        <!-- Shade for screenshot -->
        <rect id="rect_shade" x="-10000" y="0" width="0" height="0" fill="black" opacity="0.1" />
      </g>

      <!-- The margin for axis labels. The two blocks mask the chart scrolled underneath them, so
           they carry the page's background colour and not a literal white; both they and the two
           axis rules are named so the dark theme in main.css can swap them. -->
      <rect id="leftBlock" x="0" y="0" width="30" height="100%" fill="white" />
      <rect id="bottomBlock" x="0" y="0" width="100%" height="30" fill="white" />
      <line class="axis_line" x1="30" y1="30" x2="100%" y2="30" stroke-width="2" stroke="black"></line>
      <line class="axis_line" x1="30" y1="30" x2="30" y2="100%" stroke-width="2" stroke="black"></line>
      <g id="g_xaxis" text-anchor="middle" unselectable="on" onselectstart="return false;" onmousedown="return false;"
        transform="scale(1,-1)"></g>
      <g id="g_yaxis" text-anchor="end" unselectable="on" onselectstart="return false;" onmousedown="return false;"
        transform="scale(1,-1)"></g>

    </g>
  </svg>
  <div id="div_binfo">
    <p id="p_latex">LaTeX:</p>
    <p id="p_deg">Degree:</p>
    <p id="p_order"></p>
    <p id="p_nw"></p>
    <p id="p_base">Basis:</p>
    <p id="p_diff"></p>
    <p id="p_known"></p>
  </div>

  <div id="div_menubar">
    <select id="select_dashed" onchange="on_select_dashed(event)">
      <option>dash None</option>
      <option>dash d2</option>
      <option>dash d3</option>
      <option>dash d4</option>
      <option>dash d5</option>
      <option>dash d6</option>
      <option>dash d7</option>
      <option>dash d8</option>
      <option>dash d9</option>
      <option>dash d10</option>
      <option>dash d11</option>
      <option>dash d12</option>
      <option>dash d13</option>
      <option>dash d14</option>
      <option>dash d15</option>
      <option>dash d16</option>
      <option>dash d17</option>
      <option>dash d18</option>
      <option>dash d19</option>
      <option>dash d20</option>
      <option>dash d21</option>
      <option>dash d22</option>
      <option>dash d23</option>
      <option>dash d24</option>
      <option>dash d25</option>
      <option>dash d26</option>
      <option>dash d27</option>
      <option>dash d28</option>
      <option>dash d29</option>
      <option>dash d30</option>
      <option>dash d31</option>
      <option>dash d32</option>
      <option>dash d33</option>
      <option>dash d34</option>
      <option>dash d35</option>
      <option>dash d36</option>
      <option>dash d37</option>
      <option>dash d38</option>
      <option>dash d39</option>
      <option>dash d40</option>
      <option selected="selected">dash all</option>
    </select>
    <select id="select_lines" onchange="on_select_lines(event)">
      <option>All diff</option>
      <option>Current</option>
    </select>
    <select id="select_page" onchange="on_select_page(event)">
      <option>E2</option>
      <option>E3</option>
      <option>E4</option>
      <option>E5</option>
      <option>E6</option>
      <option>E7</option>
      <option>E8</option>
      <option>E9</option>
      <option>E10</option>
      <option>E11</option>
      <option>E12</option>
      <option>E13</option>
      <option>E14</option>
      <option>E15</option>
      <option>E16</option>
      <option>E17</option>
      <option>E18</option>
      <option>E19</option>
      <option>E20</option>
      <option>E21</option>
      <option>E22</option>
      <option>E23</option>
      <option>E24</option>
      <option>E25</option>
      <option>E26</option>
      <option>E27</option>
      <option>E28</option>
      <option>E29</option>
      <option>E30</option>
      <option>E31</option>
      <option>E32</option>
      <option>E33</option>
      <option>E34</option>
      <option>E35</option>
      <option>E36</option>
      <option>E37</option>
      <option>E38</option>
      <option>E39</option>
      <option>E40</option>
      <option>Einf</option>
    </select>
    <button id="button_factors" onclick="on_toggle_factors()" title="Choose which multiplications are drawn as structure lines">Lines</button>
    <button id="button_exts" onclick="on_toggle_exts()" title="Hidden extensions on the E-infinity page">Extensions</button>
    <button id="button_products" onclick="on_toggle_products()" title="Compute products and check relations on the E_r page">Products</button>
    <button id="button_graph" onclick="on_toggle_graph()" title="Plot curves s = f(n) over the chart">Graph</button>
    <button id="button_hl_clear" onclick="on_highlights_clear()" title="Remove every shift-click highlight" style="display:none">Clear ◯</button>
    <button id="button_theme" onclick="on_toggle_theme()" title="Dark mode (d)">🌙</button>
    <button id="button_cm" onclick="on_contextmenu(event)">︙</button>
  </div>

  <!-- Which multipliers are drawn as structure lines. Populated at load from each plotted
       chart's "degs_factors"/"names_factors" -- one headed section per spectrum, so a map's
       source and target (and a cofiber sequence's three charts) are toggled independently.
       Every multiplier's products are already in the data file, so toggling one is instant
       and needs no re-export. -->
  <div id="div_factors">
    <div id="div_factors_head">
      <span id="div_factors_title">Structure lines</span>
      <button onclick="on_factors_all(true)" title="Draw every multiplier">all</button>
      <button onclick="on_factors_all(false)" title="Draw none">none</button>
      <button onclick="on_factors_reset()" title="Back to the multipliers ss.json chose">reset</button>
      <button onclick="on_toggle_factors()" title="Close">&times;</button>
    </div>
    <!-- Towers: pick a multiplier's "tower" toggle below, then click classes. -->
    <div id="div_factors_tools">
      <span id="tower_status" class="factor_deg">Tower: off</span>
      <button onclick="on_towers_clear()" title="Remove every tower drawn">clear towers</button>
    </div>
    <div id="div_factors_list"></div>
  </div>

  <!-- Hidden extensions by the spectrum's self-maps (p, alpha_1, v_1, ...), read by `ss plot_ss`
       from the category's cofiber sequences ("exts"); dashed lines on the E_infinity page. -->
  <div id="div_exts">
    <div id="div_exts_head">
      <span id="div_exts_title">Hidden extensions</span>
      <button onclick="on_exts_all(true)" title="Show every multiplier">all</button>
      <button onclick="on_exts_all(false)" title="Show none">none</button>
      <button onclick="on_toggle_exts()" title="Close">&times;</button>
    </div>
    <div id="div_exts_note" class="prod_muted"></div>
    <div id="div_exts_list"></div>
  </div>

  <!-- Products, relations and Massey products on the E_r page, computed in the browser
       (plot_assets/products.js, alg.js, massey.js) from the chart's exact vectors, its ".alg.js"
       sidecar and, for E_2 Massey products, its ".massey.js" sidecar. -->
  <div id="div_products">
    <div id="div_products_head">
      <span id="div_products_title">Products</span>
      <label title="Which page the answers are written on">page
        <select id="products_page" onchange="on_products_page(event)"></select>
      </label>
      <label title="Follow the chart's page selector"><input id="products_follow" type="checkbox" checked onchange="on_products_follow(event)">follow</label>
      <button onclick="on_toggle_products()" title="Close">&times;</button>
    </div>
    <div id="div_products_query">
      <input id="products_input" type="text" spellcheck="false" autocomplete="off"
        placeholder="x_{7,1}*x_{39,1}   x_{7,1}^2 = 0   <x_{7,1},x_{7,1},x_{39,1}>" onkeydown="on_products_key(event)">
      <button onclick="on_products_compute()" title="Compute (Enter)">=</button>
      <button id="products_pick" onclick="on_products_pick()" title="Then click a bullet to insert its [stem,s,k] token">pick</button>
      <button id="products_find" onclick="on_products_find()" title="Then click a bullet: which Massey products contain it on this page?">&#10216;&#10217;&#8715;</button>
      <button onclick="on_products_clear()" title="Clear the results">clear</button>
    </div>
    <div id="products_status" class="prod_muted"></div>
    <div id="products_results"></div>
  </div>

  <!-- Curves s = f(n) drawn over the chart (plot_assets/graph.js). -->
  <div id="div_graph">
    <div id="div_graph_head">
      <span id="div_graph_title">Graph</span>
      <button onclick="on_graph_add()" title="Add a curve">+ add</button>
      <button onclick="on_graph_clear()" title="Remove every curve">clear</button>
      <button onclick="on_toggle_graph()" title="Close">&times;</button>
    </div>
    <div id="div_graph_note" class="prod_muted">n is the stem; p is the prime, q = 2(p-1). Enter to plot. Example: s = n/q + 1</div>
    <div id="div_graph_list"></div>
  </div>

  <!-- Why a differential holds, read out of the deduction log (log.db) at plot time. -->
  <div id="div_proof">
    <div id="div_proof_head">
      <span id="div_proof_title">Differential</span>
      <button onclick="hide_proof()" title="Close">&times;</button>
    </div>
    <div id="div_proof_body"></div>
  </div>

  <div id="div_menu">
    <a href="#" onclick="on_screenshot()">
      Tikz Screenshot
      <span></span>
    </a>
    <a href="#" onclick="on_time()">
      Last updated at ...
      <span></span>
    </a>
    <a href="#" onclick="on_about()">
      About
      <span></span>
    </a>
  </div>
  <script src="plot_assets/main.js"></script>
  <script src="plot_assets/alg.js"></script>
  <script src="plot_assets/massey.js"></script>
  <script src="plot_assets/products.js"></script>
  <script src="plot_assets/extensions.js"></script>
  <script src="plot_assets/graph.js"></script>
</body>

</html>
